version: '3.8'

services:
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    container_name: techstore-frontend
    environment:
      - API_URL=http://backend:3000
    depends_on:
      - backend
    networks:
      - techstore-network

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    container_name: techstore-backend
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - techstore-network

networks:
  techstore-network:
    driver: bridge